<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generation Complete</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px;}
        h1 { color: #03dac6; }
        p { font-size: 18px; margin-bottom: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 4px; border: 2px solid #444; }
        .button-container { margin-top: 20px; }
        a.button, button { display: inline-block; background-color: #6200ee; color: white; text-decoration: none; padding: 12px 25px; font-size: 16px; border-radius: 4px; transition: background-color 0.3s; margin: 5px; border: none; cursor: pointer; }
        a.button:hover, button:hover { background-color: #3700b3; }
        a.back-link { color: #bb86fc; text-decoration: none; margin-top: 20px; display: inline-block; }
        .flash-messages { list-style: none; padding: 0; margin-top: 20px; }
        .flash-messages li { background-color: #bb86fc; color: #121212; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generation Complete!</h1>
        <p>Your video has been successfully created.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <video controls>
            <source src="{{ url_for('serve_video', filename=filename) }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="button-container">
            <a href="{{ url_for('serve_video', filename=filename) }}" class="button" download>Download Video</a>
            <form action="{{ url_for('upload') }}" method="post" style="display: inline;">
                <input type="hidden" name="filename" value="{{ filename }}">
                <button type="submit" class="button">Upload to YouTube</button>
            </form>
        </div>
    </div>

    <a href="{{ url_for('index') }}" class="back-link">Start Over</a>
</body>
</html>
